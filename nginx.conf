server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow following symlinks for subpath routing
    disable_symlinks off;

    # Health check endpoints (for Docker, local blue/green, and Azure Front Door probes)
    location = /api/health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","app":"msm-unify-leadership-careers"}';
    }

    location = /hirethenextleadership/api/health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","app":"msm-unify-leadership-careers"}';
    }

    # Redirect /hirethenextleadership to /hirethenextleadership/
    location = /hirethenextleadership {
        return 301 /hirethenextleadership/;
    }

    # Security headers (aligned with vercel.json)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Support static routing with trailing slashes (e.g. /roles/ctpo/)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache static assets (images, fonts, stylesheets)
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|webp|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
